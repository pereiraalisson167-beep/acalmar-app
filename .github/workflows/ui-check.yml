name: Conferir telas

on:
  push:
    branches: [main, dev]
    paths:
      - 'app/**'
      - 'ci/ui/**'
      - '.github/workflows/ui-check.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-check
  cancel-in-progress: true

jobs:
  ui:
    name: Abrir o app no emulador e fotografar as telas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK (mesma configuração da versão final)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain -PciVersionCode=9999 \
            testReleaseUnitTest assembleRelease 2>&1 | tee build.log
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n 1)" ui-built.apk

      - name: Relatar falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/report-failure.sh build.log

      # Para conferir que a versão nova instala por cima da que a cliente já usa sem perder dados,
      # a versão publicada e a nova recebem a mesma assinatura de teste.
      - name: Preparar a versão anterior e assinar as duas para o teste
        run: |
          set -e
          curl -fsSL -o old-release.apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.0-5/acalmar.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          keytool -genkeypair -keystore ui.keystore -storetype PKCS12 -storepass android -keypass android \
            -alias ui -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Teste de telas"
          for pair in "old-release.apk:ui-old.apk" "ui-built.apk:ui-new.apk"; do
            "$BT/apksigner" sign --ks ui.keystore --ks-pass pass:android --ks-key-alias ui --key-pass pass:android \
              --out "${pair#*:}" "${pair%%:*}"
          done
          ls -la ui-old.apk ui-new.apk

      - name: Liberar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Percorrer as telas
        id: walk
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 ci/ui/run.py ui-new.apk ui-old.apk

      - name: Publicar as imagens no ramo ui-screens
        if: always()
        run: |
          set -e
          [ -d ui-out ] || mkdir ui-out
          echo "commit ${GITHUB_SHA} · resultado: ${{ steps.walk.outcome }}" > ui-out/resultado.txt
          # Estrutura do banco gerada neste build (usada nas próximas atualizações do banco).
          if [ -d app/schemas ]; then cp -r app/schemas ui-out/schemas; fi
          tmp="$(mktemp -d)"
          cp -r ui-out/. "$tmp/"
          cd "$tmp"
          git init -q -b ui-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Telas do commit ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-screens
