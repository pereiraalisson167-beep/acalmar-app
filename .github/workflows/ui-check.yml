name: Conferir telas

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ci/ui/**'
      - '.github/workflows/ui-check.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-check
  cancel-in-progress: true

jobs:
  ui:
    name: Abrir o app no emulador e fotografar as telas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar o APK (mesma configuração da versão final, assinatura de teste)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n 1)" ui-test.apk

      - name: Liberar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Percorrer as telas
        id: walk
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 ci/ui/run.py ui-test.apk

      - name: Publicar as imagens no ramo ui-screens
        if: always()
        run: |
          set -e
          [ -d ui-out ] || mkdir ui-out
          echo "commit ${GITHUB_SHA} · resultado: ${{ steps.walk.outcome }}" > ui-out/resultado.txt
          tmp="$(mktemp -d)"
          cp -r ui-out/. "$tmp/"
          cd "$tmp"
          git init -q -b ui-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Telas do commit ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-screens
